
---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: beyondos
description: BeyondOS Gaming Edition - Fedora Atomic KDE Plasma
base-image: ghcr.io/ublue-os/kinoite-main
image-version: stable

platforms:
  - linux/amd64

modules:
  - type: dnf
    install:
      packages:
        - mesa-dri-drivers
        - mesa-vulkan-drivers
        - vulkan-tools
        - mangohud
        - gamescope
        - gamemode
        - git
        - unzip

  - type: files
    files:
      - source: system
        destination: /

  - type: signing
