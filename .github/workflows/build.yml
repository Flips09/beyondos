
name: BeyondOS Build

on:
  push:
    paths-ignore:
      - "*.md"
  pull_request:
  workflow_dispatch:

jobs:
  bluebuild:
    name: Build BeyondOS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
